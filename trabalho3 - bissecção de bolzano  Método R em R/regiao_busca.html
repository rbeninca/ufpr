<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo da Região de Busca</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 100vw;
            margin: 20px auto;
            padding: 0 10px;
        }

        .conteiner {
            display: flex;
            flex-direction: row;
            gap: 16px;
        }

        .quadro_input {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 40vw;
        }

        .intervalo {
            display: flex;
            flex-direction: row;
            gap: 8px;
            margin-top: 8px;
        }

        label {
            margin-top: 8px;
            font-size: 12px;
        }

        input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 12px;
            padding: 8px 16px;
            cursor: pointer;
        }

        canvas {
            border: 1px solid #ccc;
            margin-top: 16px;
            max-width: 100%;
        }

        #iteracoes {
            white-space: pre-wrap;
            font-family: monospace;
            margin-top: 12px;
        }

        .erro {
            color: #c00;
        }

        table {
            border-collapse: collapse;
            margin-top: 16px;
            width: 100%;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 4px 8px;
            text-align: right;
        }

        th {
            background: #f0f0f0;
        }

        caption {
            font-weight: bold;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>
    <h1>Algoritmo da Região de Busca</h1>
    <p>Cercamento do mínimo: a partir de x0 e do passo delta_x, devolve o intervalo [a, b] que contém o mínimo</p>
    <div class="conteiner">
        <div class="quadro_input">
            <label>Função f(x):
                <select id="functionSelect">
                    <option value="(x - 3)**2">(x - 3)**2</option>
                    <option value="(x - 1)**2 + 1">(x - 1)**2 + 1</option>
                    <option value="(x + 2)**2">(x + 2)**2</option>
                    <option value="Math.sin(x) + x**2">Math.sin(x) + x**2</option>
                    <option value="Math.exp(x) - 3*x">Math.exp(x) - 3*x</option>
                </select>
                <input type="text" id="functionInput" value="(x - 3)**2"
                    placeholder="Digite a função (ex: (x - 3)**2)">
            </label>
            <div class="intervalo">
                <label>x0</label>
                <input type="number" id="x0Input" value="5.7" step="any">
                <label>delta_x</label>
                <input type="number" id="deltaInput" value="0.1" step="any">
            </div>
            <button id="btnexecutar">btnExecutar</button>
        </div>
        <div class="grafico">
            <canvas id="graph" width="600" height="400"></canvas>
        </div>

    </div>
    <div id="iteracoes"></div>
    <div id="tabela"></div>


    <script src="regiao_busca_web.js"></script>
    <script>
        const canvas = document.getElementById('graph');
        const ctx = canvas.getContext('2d');
        const saida = document.getElementById('iteracoes');
        const divTabela = document.getElementById('tabela');
        const listaFuncoes = [];
        const functionSelect = document.getElementById('functionSelect');

        //listener function select change
        functionSelect.addEventListener('change', () => {
            const selectedFunc = functionSelect.value;
            document.getElementById('functionInput').value = selectedFunc;
        });

        if (localStorage.getItem('funcoes')) {
            try {
                const funcoesSalvas = JSON.parse(localStorage.getItem('funcoes'));
                if (Array.isArray(funcoesSalvas)) {
                    listaFuncoes.push(...funcoesSalvas);
                }
                functionSelect.innerHTML = '';
                listaFuncoes.forEach((funcao, index) => {
                    const option = document.createElement('option');
                    option.value = funcao;
                    option.textContent = funcao;
                    functionSelect.appendChild(option);
                });


            } catch (e) {
                console.error('Erro ao carregar funções salvas:', e);
            }
        }


        document.getElementById('btnexecutar').addEventListener('click', () => {
            const funcaoInput = document.getElementById('functionInput').value;
            const x0 = parseFloat(document.getElementById('x0Input').value);
            const delta_x = parseFloat(document.getElementById('deltaInput').value);

            
            let funcao;
            try {
                funcao = new Function('x', `return ${funcaoInput};`);
                funcao(x0); // testa a expressão
                //checa se a função já está na lista, se não estiver adiciona
                if (!listaFuncoes.includes(funcaoInput)) {
                    const option = document.createElement('option');
                    option.value = funcaoInput;
                    option.textContent = funcaoInput;
                    functionSelect.appendChild(option);
                    listaFuncoes.push(funcaoInput);
                    localStorage.setItem('funcoes', JSON.stringify(listaFuncoes));
                }


            } catch (e) {
                saida.textContent = 'Função inválida: ' + e.message;
                saida.classList.add('erro');
                return;
            }

            const { a, b, passos } = regiao_busca(funcao, x0, delta_x);
            saida.textContent = `Região de busca: [a, b] = [${a.toFixed(6)}, ${b.toFixed(6)}]\n` +
                `Largura: ${(b - a).toFixed(6)}\n` +
                `Passos: ${passos.length}`;

            desenharGrafico(funcao, a, b, x0, passos);
            montarTabela(passos);
        });

        function montarTabela(passos) {
            let html = '<table><caption>Passos</caption><thead><tr>' +
                '<th>k</th><th>xk</th><th>f(xk)</th></tr></thead><tbody>';
            for (const p of passos) {
                html += `<tr><td>${p.k}</td><td>${p.x.toFixed(6)}</td><td>${p.f.toFixed(6)}</td></tr>`;
            }
            html += '</tbody></table>';
            divTabela.innerHTML = html;
        }

        function desenharGrafico(funcao, aFinal, bFinal, x0, passos) {
            // Janela centrada na região [a, b] e simétrica em relação a x0 
            const centro = (aFinal + bFinal) / 2;
            const raio = Math.abs(centro - x0) + Math.abs(bFinal - aFinal) + 0.5;
            const a = centro - raio, b = centro + raio;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Amostra a função para descobrir o intervalo de y
            const n = 200;
            const pontos = [];
            let yMinVal = Infinity, yMaxVal = -Infinity;
            for (let i = 0; i <= n; i++) {
                const x = a + (b - a) * i / n;
                const y = funcao(x);
                pontos.push({ x, y });
                if (isFinite(y)) {
                    if (y < yMinVal) yMinVal = y;
                    if (y > yMaxVal) yMaxVal = y;
                }
            }
            if (yMinVal === yMaxVal) { yMinVal -= 1; yMaxVal += 1; }
            const pad = (yMaxVal - yMinVal) * 0.1;
            yMinVal -= pad; yMaxVal += pad;

            // Margens para os rótulos dos eixos
            const mLeft = 55, mRight = 15, mTop = 15, mBottom = 40;
            const plotW = canvas.width - mLeft - mRight;
            const plotH = canvas.height - mTop - mBottom;

            const toX = x => mLeft + (x - a) / (b - a) * plotW;
            const toY = y => mTop + plotH - (y - yMinVal) / (yMaxVal - yMinVal) * plotH;

            // Faixa da região encontrada [a, b]
            ctx.fillStyle = '#e6f4ea';
            ctx.fillRect(toX(aFinal), mTop, toX(bFinal) - toX(aFinal), plotH);

            // Moldura da área do gráfico
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.strokeRect(mLeft, mTop, plotW, plotH);

            // Marcações e rótulos numéricos do eixo X
            ctx.fillStyle = '#333';
            ctx.strokeStyle = '#eee';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const nTicksX = 5;
            for (let i = 0; i <= nTicksX; i++) {
                const xv = a + (b - a) * i / nTicksX;
                const cx = toX(xv);
                ctx.beginPath();
                ctx.moveTo(cx, mTop);
                ctx.lineTo(cx, mTop + plotH);
                ctx.stroke();
                ctx.fillText(xv.toFixed(2), cx, mTop + plotH + 4);
            }

            // Marcações e rótulos numéricos do eixo Y (f(x))
            ctx.textAlign = 'right';

            const nTicksY = 5;
            for (let i = 0; i <= nTicksY; i++) {
                const yv = yMinVal + (yMaxVal - yMinVal) * i / nTicksY;
                const cy = toY(yv);
                ctx.beginPath();
                ctx.moveTo(mLeft, cy);
                ctx.lineTo(mLeft + plotW, cy);
                ctx.stroke();
                ctx.fillText(yv.toFixed(2), mLeft - 6, cy);
            }

            // Rótulo do eixo X
            ctx.fillStyle = '#000';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('x', mLeft + plotW / 2, canvas.height - 2);

            // Rótulo do eixo Y = f(x)
            ctx.save();
            ctx.translate(12, mTop + plotH / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('f(x)', 0, 0);
            ctx.restore();

            // Eixo x (y = 0), se visível
            if (yMinVal < 0 && yMaxVal > 0) {
                ctx.strokeStyle = '#888';
                ctx.beginPath();
                ctx.moveTo(mLeft, toY(0));
                ctx.lineTo(mLeft + plotW, toY(0));
                ctx.stroke();
            }

            // Curva
            ctx.strokeStyle = '#0066cc';
            ctx.beginPath();
            let iniciou = false;
            for (const p of pontos) {
                if (!isFinite(p.y)) { iniciou = false; continue; }
                const cx = toX(p.x), cy = toY(p.y);
                if (!iniciou) { ctx.moveTo(cx, cy); iniciou = true; }
                else ctx.lineTo(cx, cy);
            }
            ctx.stroke();

            // Limites a e b da região encontrada
            ctx.strokeStyle = '#c00';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            for (const [x, rot] of [[aFinal, 'a'], [bFinal, 'b']]) {
                const cx = toX(x);
                ctx.beginPath();
                ctx.moveTo(cx, mTop);
                ctx.lineTo(cx, mTop + plotH);
                ctx.stroke();
                ctx.fillStyle = '#c00';
                ctx.fillText(rot, cx + 2, mTop + 10);
            }

            // Pontos xk visitados pelo algoritmo
            ctx.fillStyle = 'orange';
            for (const p of passos) {
                if (p.x < a || p.x > b) continue;
                ctx.beginPath();
                ctx.arc(toX(p.x), toY(p.f), 3, 0, 2 * Math.PI);
                ctx.fill();
            }

            // Marca o ponto inicial x0
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(toX(x0), toY(funcao(x0)), 5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillText('x0', toX(x0) + 6, toY(funcao(x0)) - 6);
        }

        document.getElementById('btnexecutar').click();
    </script>
</body>

</html>
